<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>情绪温度计 · 量化小仙女 — 点开有料</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--ink:#eaf2ff;--mut:#9fb6d2;--dim:#64809f;--gold:#ffd76a;--card:rgba(125,185,255,.06);--bd:rgba(125,185,255,.16);--liftG:-52px;--liftF:-50px}
body{min-height:100vh;background:radial-gradient(1000px 720px at 82% -12%,#13537f 0%,transparent 56%),radial-gradient(820px 700px at -8% 118%,#0b4033 0%,transparent 52%),linear-gradient(165deg,#050b18,#0a1830 58%,#071121);color:var(--ink);display:flex;justify-content:center;padding:20px 16px 72px}
.wrap{width:min(470px,100%)}
.hint{text-align:right;font-size:10.5px;color:#5fd0a8;margin:0 6px 8px;letter-spacing:.3px}
.head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.brand{font-weight:800;font-size:19px}.brand i{font-style:normal;color:#4fc3f7}.brand small{font-size:11px;font-weight:400;color:var(--mut);margin-left:4px}
.go{font-size:10.5px;color:var(--mut);border:1px solid var(--bd);border-radius:20px;padding:3px 8px}.go:after{content:' ›'}
.date{border-top:1px dashed rgba(125,185,255,.2);border-bottom:1px dashed rgba(125,185,255,.12);margin-top:9px;padding:9px 2px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.dv{font-size:13.5px;color:var(--gold);font-weight:700}.dc{font-size:11px;color:#4fc3f7}
.sub{font-size:10.5px;color:var(--mut);margin:7px 2px 13px;letter-spacing:.2px}
.card{background:linear-gradient(170deg,#0e2139,#0a1728);border:1px solid var(--bd);border-radius:26px;padding:10px 18px 20px;box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}
.gauge{position:relative;cursor:pointer;user-select:none}
canvas{display:block;width:100%}
.read{position:absolute;left:0;right:0;top:64%;text-align:center;pointer-events:none}
.read .t{font-size:56px;font-weight:900;line-height:.9;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.5)}
.read .t em{font-style:normal;font-size:19px;color:var(--gold);vertical-align:top}
.read .s{font-size:19px;font-weight:800;margin-top:2px}
.hot{color:#ffd76a}
.zone{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:6px}
.z{display:flex;align-items:center;gap:7px;font-size:11px;cursor:pointer;background:rgba(255,255,255,.03);border:1px solid rgba(125,185,255,.1);border-radius:12px;padding:7px 9px}
.z .dot{width:13px;height:13px;border-radius:5px;flex:0 0 auto}.z b{font-weight:700;color:#fff}.z small{color:var(--dim);margin-left:auto}
.label-row{display:flex;gap:10px;margin-top:16px;transform:translateY(var(--liftF))} /* 抬升L2: 动量及以下跟随上移(只增不减) */
.box{flex:1;cursor:pointer;user-select:none;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:15px 6px 11px;text-align:center;transition:.15s;position:relative}
.box:active{transform:scale(.96)}.box .k{font-size:11px;color:var(--dim)}.box .v{font-size:18px;font-weight:900;margin-top:2px}
.tag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:9px;color:#4fc3f7;background:#0a1728;border:1px solid var(--bd);border-radius:10px;padding:1px 8px;white-space:nowrap}
.gate{display:flex;align-items:center;gap:10px;margin-top:13px;cursor:pointer;user-select:none;background:var(--card);border:1px dashed var(--bd);border-radius:16px;padding:12px 14px;font-size:12.5px;color:#e2efff;line-height:1.55;transform:translateY(var(--liftF))} /* 抬升L2 */
.badge{font-weight:800;font-size:12px;color:#081422;padding:3px 9px;border-radius:20px;white-space:nowrap}
.on{background:#2ecc71}.half{background:#ffd76a}.off{background:#ff5252}
.ad{margin-top:13px;background:linear-gradient(90deg,rgba(255,214,120,.18),rgba(255,214,120,.05));border:1px solid rgba(255,214,120,.35);border-radius:16px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.ad .l{font-size:13px;color:#ffe6a6;font-weight:700}.ad .b{font-size:11px;border:1px solid rgba(255,214,120,.5);color:#ffd76a;border-radius:20px;padding:4px 10px;flex:0 0 auto}
.range{display:flex;align-items:center;gap:10px;margin-top:13px;cursor:pointer}.range em{font-style:normal;font-size:10px;color:var(--dim);margin-right:2px}.rngv{color:var(--gold);font-weight:800;width:42px;text-align:center;font-size:13px}
input[type=range]{flex:1;-webkit-appearance:none;height:7px;border-radius:6px;outline:none;background:linear-gradient(90deg,#5aa8e6 0 16.6%,#43c9b0 16.6% 33.3%,#8fd36b 33.3% 50%,#ffcd5a 50% 66.6%,#ff9a3c 66.6% 83.3%,#ff5252 83.3% 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:21px;height:21px;border-radius:50%;background:#fff;border:6px solid #ffd76a;cursor:pointer;box-shadow:0 2px 9px rgba(0,0,0,.5)}
.src{margin-top:13px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:10px;color:var(--dim);line-height:1.9}
.src u{text-decoration:none;border-bottom:1px dotted var(--dim);cursor:pointer}
.mask{position:fixed;inset:0;background:rgba(2,8,16,.62);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.mask.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;height:min(80vh,720px);background:linear-gradient(180deg,#10243a,#0a1728);border:1px solid var(--bd);border-bottom:none;border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:50;display:flex;flex-direction:column;box-shadow:0 -18px 60px rgba(0,0,0,.65)}
.sheet.open{transform:translateY(0)}
.sb{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid rgba(125,185,255,.14);flex:0 0 auto}
.sb .l .tt{font-size:16px;font-weight:800}.sb .l .p{font-size:11px;color:#5fd0a8;font-weight:700;margin-top:1px}
.sb .x{cursor:pointer;color:var(--dim);font-size:16px;padding:4px 10px;border-radius:9px;background:rgba(255,255,255,.05)}
.sbody{overflow:auto;padding:15px 17px 36px;font-size:13px;color:#dbe8fa;line-height:1.85}
.sbody h4{font-size:12.5px;color:var(--gold);margin:16px 0 6px;font-weight:800}.sbody h4:first-child{margin-top:0}
.big3{display:flex;gap:9px;margin-top:5px}.b3{flex:1;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:10px 2px}.b3 .n{font-size:20px;font-weight:900}.b3 .l2{font-size:10px;color:var(--dim)}
table{width:100%;border-collapse:collapse;margin:7px 0;font-size:12.5px}th,td{border-bottom:1px dashed rgba(125,185,255,.12);padding:6px 5px;text-align:left;vertical-align:top}th{color:var(--dim);font-weight:700;font-size:11px}
.hi{color:#ff5252;font-weight:800}.gn{color:#2ecc71;font-weight:800}.gd{color:#ffd76a;font-weight:800}
.bar{background:#0c1d33;border-radius:9px;height:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%}
ul{margin:3px 0;padding-left:20px}
.ck{font-size:10.5px;color:var(--dim);margin-top:13px;border-top:1px dashed rgba(125,185,255,.14);padding-top:8px}
.momentum{margin-top:14px;transform:translateY(var(--liftF));background:var(--card);border:1px solid rgba(255,214,106,.28);border-radius:18px;padding:11px 14px 13px;cursor:pointer;user-select:none} /* 抬升L2 */
.momtop{display:flex;align-items:center;gap:13px}
.momcanvas{width:122px;height:74px;flex:0 0 auto}
.momcanvas canvas{width:100%;height:100%}
.mominfo{flex:1;min-width:0}
.momlab{font-size:11.5px;color:var(--mut);letter-spacing:.3px}
.momval{font-size:24px;font-weight:900;line-height:1.1;margin-top:3px}
.momact{font-size:11.5px;color:#d7e7fb;margin-top:5px;line-height:1.5}
.momstrip{display:flex;gap:8px;margin-top:10px}
.momchip{flex:1;text-align:center;border:1px solid var(--bd);border-radius:12px;padding:7px 3px;font-size:11px;color:var(--mut);background:rgba(5,15,28,.35);line-height:1.5}
.momchip b{display:block;font-size:13.5px;color:#cfe2f7;font-weight:800}
.momchip.cur{background:rgba(255,214,106,.12);border-color:#ffd76a;color:#fff}
.momchip.cur b{color:#ffd76a}
.momchip small{font-size:9.5px;opacity:.85}

/* ============ 闭环系统总览(LOOP) · 只增不减新增块 ============
   把页面各部位串成"温度→动量→梯队→守住"的闭环; 4节各显示今日读数,
   第④守(卖出纪律)/能量四态当前无逐日数据字段 → 以理论档文字呈现, 不造假。 */
.loop{margin-top:13px;background:linear-gradient(150deg,rgba(79,195,247,.09),rgba(255,215,106,.04) 55%,rgba(46,204,113,.06));border:1px solid rgba(79,195,247,.28);border-radius:18px;padding:12px 13px 13px;cursor:pointer;user-select:none}
.loop .lt{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:#bfe7ff;letter-spacing:.3px}
.loop .lt i{font-style:normal;color:#5fd0a8;font-size:10.5px;font-weight:700}
.loop .ring{display:flex;align-items:stretch;gap:5px;margin-top:10px}
.ln{flex:1;text-align:center;background:rgba(5,15,28,.4);border:1px solid rgba(125,185,255,.14);border-radius:13px;padding:8px 3px 7px;position:relative}
.ln .a{font-size:10px;color:#8fd36b;letter-spacing:.5px;font-weight:800}
.ln .b{font-size:14.5px;font-weight:900;color:#fff;margin-top:3px;line-height:1.2}
.ln .c{font-size:9px;color:var(--dim);margin-top:2px;line-height:1.4;min-height:12px}
.ln.th .b{color:#ffd76a;font-weight:800;font-size:12.5px}
.ln.th .c{color:#ffd76a;opacity:.8}
.loop .leg{font-size:9px;color:var(--dim);margin-top:8px;letter-spacing:.2px;line-height:1.5}
.loop .go{float:right;font-size:10px;color:#4fc3f7;border:1px solid rgba(79,195,247,.35);border-radius:16px;padding:2px 9px;margin-top:2px}
.loop .go:after{content:' ›'}
/* ---- 近30日走势趋势图 ---- */
.trwrap{background:#0b1d34;border:1px solid var(--bd);border-radius:16px;padding:12px 12px 10px;margin:4px 0 10px}
.trwrap canvas{display:block;width:100%;height:auto}
.tagn{font-size:10px;color:var(--dim);text-align:center;margin-top:6px;letter-spacing:.2px}

/* ============ 布局抬升组(LIFT) ============
   L1 主表盘组(#g + 读数浮层 + 六区图例): translateY(---liftG) 原 -52
   L2 动量及以下(.momentum/.label-row/.gate): translateY(var(--liftF)) 原 -50
   纯位移归拢, 像素零变化; 元素未删改, 遵循只增不减。 */
#g{transform:translateY(var(--liftG))}
.gauge .read{transform:translateY(var(--liftG))}
#zk{transform:translateY(var(--liftG))}
</style>
</head>
<body>
<div class="wrap">
<div class="hint">· 每个部位都能点 · 点开看数据与说明 ·</div>
<div class="head" data-k="about"><div class="brand">情绪温度计 <i>·</i><small>量化小仙女</small></div><div class="go">测温口径</div></div>
<div class="date" data-k="history"><div class="dv"><span id="dateTxt">--</span> · 收盘</div><div class="dc">近30日走势 ›</div></div>
<div class="sub">收盘情绪动量 · 温度=赚钱效应(客观统计) · 涨红 / 跌绿</div>
<div class="card">
  <div class="gauge" data-k="temp"><canvas id="g" width="460" height="400"></canvas>
    <div class="read"><div class="t"><span id="big">--</span><em>°</em></div><div class="s" id="state">—</div></div>
  </div>
  <div class="zone" id="zk"></div>
  <div class="momentum" data-k="mom" style="display:none">
    <div class="momtop"><div class="momcanvas"><canvas id="mc" width="122" height="74"></canvas></div>
      <div class="mominfo"><div class="momlab">情绪动量 · 状态与力度</div><div class="momval" id="momV">—</div><div class="momact" id="momA"></div></div>
    </div>
    <div class="momstrip" id="momS"></div>
  </div>
  <div class="label-row" id="row3"></div>
  <div class="gate" id="gateRow" data-k="gate"></div>
  <div class="loop" data-k="loop">
    <div class="lt">情绪闭环 · 温度→动量→梯队→守住 <small style="font-weight:400;font-size:9px;color:#9fb6d2">(闭环系统理论·今日走到哪)</small></div>
    <div class="ring" id="loopRing"></div>
    <div class="leg">四力闭环：温度定方向(何时买)，动量定力度(买多重)，梯队定标的(买什么)，卖出纪律守住利润(何时走)。点开看全链与第④守细则。</div>
    <div class="go">闭环详解</div>
  </div>
  <div class="ad" data-k="tomorrow"><div class="l">明日怎么看 · 观察点</div><div class="b">点开 ›</div></div>
  <div class="range" data-k="sim"><em>拖动模拟温度</em><input type="range" id="sl" min="0" max="100" value="58"><div class="rngv" id="live">58°</div></div>
  <div class="src" id="srcRow"></div>
</div>
</div>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"><div class="sb"><div class="l"><div class="tt" id="st">—</div><div class="p" id="sp"></div></div><div class="x" id="sx">✕</div></div><div class="sbody" id="sb"></div></div>
<script>
(function(){
var TODAY={temp:58,zt:73,zb:37,zr:33.6,xy:3.0,xs:65,xz:19,lb:4,date:'2026-09-08',
 em:'均衡 ×0.8',tit:'回暖58° · 高标收敛',want:'回暖非反转',gateTxt:'半开 · 可试探',
 sig:'赚钱效应为正(65%昨日涨停今收涨、19家再涨停)，但炸板率33.6%近乎翻倍——量升、质降',
 watch:['赚钱效应能否站稳（决定半开能否转开闸）','4板梯队(爱仕达/百大/亚盛)能否走出5板定高度','炸板率能否回落，否则谨防高开诱多'],
 ladder:[['4板','爱仕达 · 百大集团 · 亚盛集团'],['3板','海欣食品 · 中国出版'],['2板','3家'],['首板','36家（连板池偏薄）']]};
var ZONE=[[20,'冰点','#5aa8e6','极冷 → 空仓防守','跌停潮、赚钱效应极差，接力几乎全断，只防守'],
[40,'低迷','#43c9b0','偏冷 → 观望为主','效应弱转无持续，反弹多一日游，别急着抄'],
[55,'谨慎','#8fd36b','分歧 → 轻仓试探','效应刚转好方向未明，先小仓试错'],
[70,'回暖','#ffcd5a','转好 → 可试探','效应站稳、接续改善，是多数行情的可参与区'],
[85,'亢奋','#ff9a3c','强 → 参与且控回撤','效应强情绪高，防高开诱多与高位退潮'],
[100,'过热','#ff5252','极致 → 只卖不追','过热=反向风险，冲高无量易高开低走，落袋优先']];
var zz=function(t){for(var i=0;i<ZONE.length;i++)if(t<=ZONE[i][0])return ZONE[i];return ZONE[ZONE.length-1]};
var fmt=function(n){var s=(Math.round(n*10)/10).toFixed(1);return (n>=0?'+':'')+s+'%'};
var cv=document.getElementById('g'),x=cv.getContext('2d'),W=cv.width,H=cv.height,CX=W/2,CY=H*.58,ST=120,AR=300,Ro=W*.31,Ri=W*.20,Rn=W*.34;
var an=function(f){return Math.PI*(ST-f*AR)/180+Math.PI+Math.PI/12},P=function(f,r){var a=an(f);return{x:CX+r*Math.cos(a),y:CY-r*Math.sin(a)}};
var hx=function(c){c=c.replace('#','');return[parseInt(c.substr(0,2),16),parseInt(c.substr(2,2),16),parseInt(c.substr(4,2),16)]};
var mx=function(a,b,k){return[Math.round(a[0]+(b[0]-a[0])*k),Math.round(a[1]+(b[1]-a[1])*k),Math.round(a[2]+(b[2]-a[2])*k)]};
function draw(v){x.clearRect(0,0,W,H);x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=16;x.fillStyle='#0a1a2f';x.beginPath();x.arc(CX,CY,Rn+30,0,7);x.fill();x.shadowBlur=0;
 // 每区按0-100逐小片画成四边扇块(fill)，显式cos/sin顶点——彻底规避 arc 弧向歧义，色带与刻度严格对齐
 var zc=function(t){for(var q=0;q<ZONE.length;q++)if(t<=ZONE[q][0])return ZONE[q][2];return ZONE[ZONE.length-1][2]};
 var SPC=0.5; // 每片覆盖 f 步长
 for(var ff=0;ff<100-SPC/2;ff+=SPC){var t0=ff,t1=Math.min(100,ff+SPC);
  var q0=an(t0/100),q1=an(t1/100);
  x.beginPath();
  x.moveTo(CX+Ro*Math.cos(q0),CY-Ro*Math.sin(q0));
  x.lineTo(CX+Ro*Math.cos(q1),CY-Ro*Math.sin(q1));
  x.lineTo(CX+Ri*Math.cos(q1),CY-Ri*Math.sin(q1));
  x.lineTo(CX+Ri*Math.cos(q0),CY-Ri*Math.sin(q0));
  x.closePath();x.fillStyle=zc((t0+t1)/2);x.fill();}
 x.lineWidth=1;x.strokeStyle='rgba(0,0,0,.20)';x.beginPath();x.arc(CX,CY,Ro,0,7);x.arc(CX,CY,Ri,0,7,true);x.stroke();
 x.lineWidth=1.5;x.strokeStyle='rgba(255,255,255,.13)';x.beginPath();x.arc(CX,CY,(Ro+Ri)/2,0,7);x.stroke();
 x.lineWidth=2;x.strokeStyle='rgba(255,255,255,.8)';for(var n=0;n<=100;n+=10){var a=P(n/100,Ro+2),b=P(n/100,Ro+12);x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();}
 x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.font='700 14px "Microsoft YaHei"';
 for(var n=0;n<=100;n+=10){var p=P(n/100,Rn),td=ST-n*AR/100;x.save();x.translate(p.x-2*Math.cos(td*Math.PI/180),p.y-2*Math.sin(td*Math.PI/180));x.rotate((td+90)*Math.PI/180);x.fillText(''+n,0,0);x.restore();}
 var ti=P(v/100,Ri-5),ta=P(v/100,-20);x.lineCap='round';x.strokeStyle='rgba(255,255,255,.18)';x.lineWidth=5;x.beginPath();x.moveTo(ta.x,ta.y);x.lineTo(CX,CY);x.stroke();
 x.strokeStyle='#f6f8fc';x.lineWidth=5;x.shadowColor='rgba(255,255,255,.5)';x.shadowBlur=9;x.beginPath();x.moveTo(CX,CY);x.lineTo(ti.x,ti.y);x.stroke();x.shadowBlur=0;
 x.fillStyle='#fff';x.beginPath();x.arc(CX,CY,11,0,7);x.fill();x.fillStyle='#0b1422';x.beginPath();x.arc(CX,CY,5,0,7);x.fill();}
document.getElementById('zk').innerHTML=ZONE.map(function(z,i){return '<div class="z" data-k="zone'+i+'"><i class="dot" style="background:'+z[2]+'"></i><b>'+z[1]+'</b><small>&lt;'+z[0]+'</small></div>'}).join('');
var B3=[['zt','涨停家数',TODAY.zt+'家','#ff5252','炸板率 '+TODAY.zr+'% ›'],['xy','赚钱效应',fmt(TODAY.xy),'#ff5252','昨板今收涨 '+TODAY.xs+'% ›'],['lb','最高连板',TODAY.lb+'板','#ffd76a','看梯队 ›']];
document.getElementById('row3').innerHTML=B3.map(function(b){return '<div class="box" data-k="'+b[0]+'"><span class="tag">'+b[4]+'</span><div class="k">'+b[1]+'</div><div class="v" style="color:'+b[3]+'">'+b[2]+'</div></div>'}).join('');

  if(ef.up_pct!=null)TODAY.xs=ef.up_pct;
  if(cd.top!=null){var m=/^(\d+)\s*板/.exec(String(cd.top));if(m)TODAY.lb=+m[1];}
  if(cd.top_note)TODAY.lbNote=cd.top_note;

  if(tp.em)TODAY.em=tp.em;
  /* B2::派生 */
  TODAY.sig=(tp.desc!=null)?String(tp.desc):(TODAY.sig||'');
  TODAY.lb=TODAY.lb||0;
  if(ef.n!=null)TODAY.xtz=ef.n;
  if(ef.n_rezt!=null)TODAY.xz=ef.n_rezt;
  if(ef.n_up!=null)TODAY.xup=ef.n_up;
  if(cd.top_note)TODAY.lbNote=String(cd.top_note);
  if(cd.zb_note)TODAY.zbNote=String(cd.zb_note);
  if(!TODAY.gateTxt||TODAY.gateTxt===TODAY._g0)TODAY.gateTxt=(tp.gate!=null)?String(tp.gate):TODAY.gateTxt;
  TODAY._g0=TODAY.gateTxt;
  TODAY.ladder=[];var _grp={};TODAY.nLb=0;
  if(d.ladder&&d.ladder.length){d.ladder.forEach(function(q){var gp=String(q.r).replace(/[^0-9.]/g,'')+'板';if(!_grp[gp])_grp[gp]=[];_grp[gp].push(q.n);});}
  Object.keys(_grp).forEach(function(gp){TODAY.ladder.push([gp,_grp[gp].join(' · ')]);TODAY.nLb+=_grp[gp].length;});
  TODAY.ladder.sort(function(a,b){return(parseInt(b[0])||99)-(parseInt(a[0])||99);});
  var _zt=+TODAY.zt||0;TODAY.nSz=Math.max(0,_zt-TODAY.nLb);

  /* 明日倾向串: 用闸门分类 */
  var cls=String(tp.cls||'warm');
  if(co.concl)TODAY.want=co.concl;
  TODAY.date=String(d.meta&&d.meta.today||TODAY.date).replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3');
  if(tr&&tr.length>TR.length)setTrend(tr);
  buildAll(TODAY); renderTrend && renderTrend();
  return true;
}
